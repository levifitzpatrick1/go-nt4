name: CI
on:
  push:
    branches: [Trunk]
  pull_request:
    branches: [Trunk]
env:
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1' # go.dev/dl/?mode=json stable, verified 2026-09-25
      - run: go mod download && go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -timeout=120s ./...
      - run: go test -race -count=2 -timeout=180s ./...
      - run: go build ./examples/...
      - name: Bounded fuzz smoke (individual targets)
        run: |
          for target in FuzzControlBatch FuzzOfflineTransitions; do go test . -run '^$' -fuzz "^$target$" -fuzztime=2s -parallel=2 -timeout=30s; done
          for target in FuzzDecodeFrames FuzzEncodeValue; do go test ./internal/wire -run '^$' -fuzz "^$target$" -fuzztime=2s -parallel=2 -timeout=30s; done
      - name: Linux ARM64 cross-build (not target execution)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
  native-ntcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: python3 -m venv .ntcore-venv && .ntcore-venv/bin/python -m pip install 'pyntcore==2026.2.2'
      - run: NT4_INTEROP_PYTHON="$PWD/.ntcore-venv/bin/python" scripts/interop/run.sh
  # Actual Orange Pi 5 runtime tests are a separate external release gate.
  # See docs/TARGET_VALIDATION.md; cross-compilation cannot satisfy it.
